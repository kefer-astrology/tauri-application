{{ define "main" }}
  <article class="content">
    <header class="page-header">
      <p class="eyebrow">{{ .Section }}</p>
      <h1>{{ .Title }}</h1>
      {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
    </header>
    <div class="prose">
      {{ .Content }}
    </div>
    {{ if and .IsHome .Pages }}
      <section class="card-grid">
        {{ range .Pages.ByWeight }}
          <a class="card" href="{{ .RelPermalink }}">
            <h2>{{ .Title }}</h2>
            <p>{{ with .Description }}{{ . }}{{ else }}Open this section.{{ end }}</p>
          </a>
        {{ end }}
      </section>
    {{ end }}
  </article>
{{ end }}
