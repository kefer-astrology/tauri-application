<!doctype html>
<html lang="{{ site.Language.Lang }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}" />
    <link rel="icon" type="image/png" href="{{ "favicon.png" | relURL }}" />
    {{ $style := resources.Get "css/site.css" | minify | fingerprint }}
    <link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}" />
  </head>
  <body>
    <div class="shell">
      <header class="site-header">
        <a class="brand" href="{{ site.Home.RelPermalink }}">Kefer Astrology</a>
        <div class="nav-group">
          <nav class="top-nav" aria-label="Primary">
            <a href="{{ "manual/" | relLangURL }}">{{ i18n "nav_manual" }}</a>
            <a href="{{ "developer/" | relURL }}">{{ i18n "nav_developer_manual" }}</a>
            <a href="{{ "guides/" | relLangURL }}">{{ i18n "nav_guides" }}</a>
          </nav>
          <nav class="lang-switch" aria-label="Language">
            {{ range .AllTranslations }}
              <a href="{{ .RelPermalink }}" {{ if eq .Lang $.Lang }}aria-current="page"{{ end }}>{{ .Language.Label }}</a>
            {{ end }}
          </nav>
        </div>
      </header>
      <main>
        {{ block "main" . }}{{ end }}
      </main>
    </div>
  </body>
</html>
