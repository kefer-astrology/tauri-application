<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}" />
    <link rel="icon" type="image/png" href="{{ "favicon.png" | relURL }}" />
    {{ $style := resources.Get "css/site.css" | minify | fingerprint }}
    <link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}" />
  </head>
  <body>
    <div class="shell">
      <header class="site-header">
        <a class="brand" href="{{ site.Home.RelPermalink }}">Kefer Astrology</a>
        <nav class="top-nav" aria-label="Primary">
          <a href="{{ "manual/" | relURL }}">Manual</a>
          <a href="{{ "developer/" | relURL }}">Developer Manual</a>
          <a href="{{ "guides/" | relURL }}">Guides</a>
        </nav>
      </header>
      <main>
        {{ block "main" . }}{{ end }}
      </main>
    </div>
  </body>
</html>
