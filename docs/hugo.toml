baseURL = "/"
title = "Kefer Astrology"
disableKinds = ["taxonomy", "term", "rss", "sitemap"]
staticDir = ["static", "../static"]

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[languages]
  [languages.en]
    languageName = "English"
    languageCode = "en-US"
    weight = 1
  [languages.cs]
    languageName = "Čeština"
    languageCode = "cs-CZ"
    weight = 2
  [languages.es]
    languageName = "Español"
    languageCode = "es-ES"
    weight = 3
  [languages.fr]
    languageName = "Français"
    languageCode = "fr-FR"
    weight = 4

[params]
  description = "The Kefer Astrology manual, developer reference, and guided product tour."

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
