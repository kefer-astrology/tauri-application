[package]
name = "app"
version = "0.1.1"
description = "Kefer astrology desktop application (Tauri 2, React UI, Python sidecar)."
authors = ["Alysonhower Veras Vieira"]
license = "MIT"
repository = "https://github.com/kefer-astrology/tauri-application"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2.10.0"
tauri-plugin-opener = "2.7.0"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "default-tls"] }
anise = { version = "=0.10.6", default-features = false }
hifitime = "4"
sha2 = "0.10"
tzf-rs = { version = "2.1.2", default-features = false, features = ["bundled"] }

[dev-dependencies]
# Already pulled in transitively by `anise`; declared directly so test code
# can build synthetic SPK byte buffers (summary-metadata only, no Chebyshev
# data) to exercise chain-discovery/precedence scenarios real bundled or
# downloadable kernels can't construct on demand.
zerocopy = "0.8"

[features]
# Compile and link the Swiss Ephemeris C library (AGPL-3.0 / commercial).
# Disable for a fully license-clean build that uses anise + bundled `de440s.bsp` only.
swisseph = []
